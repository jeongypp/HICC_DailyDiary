spring:
  application:
    name: backend

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dailydiary;MODE=MySQL # MySQL 모드로 실행하여 문법 호환성 유지
    username: sa
    password:

  # H2 웹 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger(Springdoc) 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html # 접속 경로 설정
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs