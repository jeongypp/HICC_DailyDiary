spring:
  application:
    name: backend

  jackson:
    property-naming-strategy: SNAKE_CASE # API 통신 시 명세서에 맞는 언더바 형식으로 통일

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dailydiary;MODE=MySQL # MySQL 모드로 실행하여 문법 호환성 유지
    username: sa
    password:

  # H2 웹 콘솔 활성화
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger(Springdoc) 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html # 접속 경로 설정
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs

# Gemini AI API 환경변수 매핑
gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
    key: ${GEMINI_API_KEY:default_key}

# 공공데이터포털(data.go.kr) 날씨정보 API 환경변수 매핑
weather:
  api:
    url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst
    key: ${WEATHER_API_KEY:default_key}
